[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jpec"
version = "0.1.0"
description = "JAX-accelerated complex TwoSpect harmonic matched filtering for continuous gravitational waves from binaries"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Damon Cheung", email = "damoncht@umich.edu" }]
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "jax>=0.10.1",
    "jaxtyping>=0.3.10",
    "lalsuite==8.0.2",
    "solar-system-ephemerides>=1.2.0",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
    "pydantic>=2.0",
]

[project.scripts]
jpec = "jpec.pipelines.cli:main"

[project.optional-dependencies]
bench = ["fasttracks>=0.1.0"]
gpu = ["jax[cuda12]>=0.10.1"]
nb = [
    "jupyterlab>=4.6",
    "nbformat>=5.11",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pre-commit>=3.7",
    "pyright>=1.1.390",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["jpec*"]

[tool.setuptools.package-data]
jpec = ["style.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
exclude = ["docs", "notebooks"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "ANN",
    "UP",
    "N",
    "D",
]
ignore = [
    "F722",
    "ANN401",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]
