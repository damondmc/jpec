parameter_space:                # the box the sources are drawn from and the bank is built over
  f0: [204.0, 204.1]            # Hz, the f0 range the sensitivity depth is measured over
  ap: [5.0, 15.0]              # light-seconds, the published O4a prior
  period: [7.0, 15.0]           # days, the published O4a prior
  phi_b: [0.0, 6.283185307179586]   # rad, orbital phase at the reference epoch
  alpha: [0.0, 6.283185307179586]   # rad, the whole sky
  delta: [-1.5707963267948966, 1.5707963267948966]

template_bank:
  n_ap_blocks: 1                # ap blocks, as the search's
  mismatch: 0.4                 # the search's; jpec injection-setup --mismatch sets another

trials:
  n_injections: 500             # sources drawn once and reused at every amplitude
  n_steps: 2                    # lattice steps each side of the injection, per orbital axis
  n_sky_neighbours: 10          # sky lattice points searched around it
  cos_iota: [-1.0, 1.0]         # inclination the sources are drawn over, isotropic
  psi: [0.0, 3.141592653589793] # rad, polarization angle

recovery_curve:
  sensitivity_depth: [15.0, 30.0] # sqrt(Sn) / h0 of the first scan, loud to weak; a refinement
                                # steps out by 2x when the scan misses the efficiency
  n_amplitudes: 8
  efficiency: 0.95              # the recovered fraction h0_ul is quoted at
  tolerance: 0.05               # stop once h0_ul is known to this relative error
  n_refinements: 4              # h0 points added one at a time at the fitted h0_ul until then

search_loop:
  sky_batch_size: 8             # sky points per transform, which share its orbital basis
  period_batch_size: 16         # trial periods per transform; the orbital basis, a job's largest
                                # memory term, grows with it
  f0_batch_size: 32             # f0 points matched at once, which caps the S(phi_b) held
  n_sub_bin_offsets: 8          # template offsets across one bin; an f0 point takes the nearest

thresholds: [0.02835, 0.02716, 0.02591, 0.02460]
                                # on S, one sensitivity depth measured at each; set them from the
                                # Gaussian null of the same band, here 1, 10, 100 and 1000 noise templates expected
                                # above it over 0.1 Hz at 204 Hz

sft_glob: /path/to/sfts/*.sft   # the glob jpec check-sft was given, as the jobs will see it
